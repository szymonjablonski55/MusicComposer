<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Music Composer</title>
    <script src="http://unpkg.com/tone"></script>
    <style>
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .button-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; }
        .record-button { background-color: #ff4444; color: white; border: none; }
        .sound-button { background-color: #4444ff; color: white; border: none; }
        .recording { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <div th:replace="~{nav :: nav}">...</div>
    <div class="container mt-4">
        <div class="d-flex justify-content-center mb-3">
            <button id="recordButton" type="button" class="btn btn-success me-2" onclick="toggleRecording()">
                🎙️ Start Recording
            </button>
            <button id="saveButton" type="button" class="btn btn-outline-success" onclick="saveRecording()">
                💾 Download
            </button>
        </div>

        <div class="d-flex justify-content-between gap-4 mb-4">
            <button type="button" class="btn btn-warning" onclick="playSound(1)">
                🎵 C4
            </button>
            <button type="button" class="btn btn-warning" onclick="playSound(2)">
                🎵 E4
            </button>
            <button type="button" class="btn btn-warning" onclick="playSound(3)">
                🎵 G4
            </button>
            <button type="button" class="btn btn-warning" onclick="playSound(4)">
                🎵 B4
            </button>

            <button type="button" class="btn btn-warning" onclick="playSound(5)">
                🎵 B2
            </button>

            <button type="button" class="btn btn-warning" onclick="playSound(6)">
                🎵 A4
            </button>

            <button type="button" class="btn btn-warning" onclick="playSound(7)">
                🎵 F5
            </button>
        </div>

        <!-- Progress Bar -->
        <div class="progress" style="height: 30px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%;" id="progressBar">
                Recording Progress
            </div>
        </div>
    </div>

<script>
    let isRecording = false;
    let recordingStartTime;
    let recordedNotes = [];
    let recordingBlob = null;

    const synth = new Tone.Synth().toDestination();
    const recorder = new Tone.Recorder();
    synth.connect(recorder);

    const notes = {
        1: "C4",
        2: "E4",
        3: "G4",
        4: "B4",
        5: "B2",
        6: "A4",
        7: "F5"
    };

    function playSound(buttonNum) {
        const note = notes[buttonNum];
        synth.triggerAttackRelease(note, "8n");

        if (isRecording) {
            recordedNotes.push({
                note: note,
                time: Date.now() - recordingStartTime
            });
        }
    }

    async function toggleRecording() {
        const recordButton = document.getElementById('recordButton');

        if (!isRecording) {
            isRecording = true;
            recordingStartTime = Date.now();
            recordedNotes = [];
            await recorder.start();

            recordButton.textContent = "Recording...";
            recordButton.classList.add('recording');
            document.getElementById('downloadSection').style.display = 'none';

            setTimeout(() => {
                if (isRecording) {
                    stopRecording();
                }
            }, 5000);
        } else {
            stopRecording();
        }
    }

    async function stopRecording() {
        isRecording = false;

        recordingBlob = await recorder.stop();

        const recordButton = document.getElementById('recordButton');
        recordButton.textContent = "Start Recording";
        recordButton.classList.remove('recording');
        document.getElementById('downloadSection').style.display = 'block';
    }

    async function saveRecording() {
        if (!recordingBlob) {
            alert('No recording available');
            return;
        }

        const saveButton = document.getElementById('saveButton');
        saveButton.textContent = 'Saving...';
        saveButton.disabled = true;

        try {
            const formData = new FormData();
            formData.append('audioData', recordingBlob);
            formData.append('trackData', JSON.stringify(recordedNotes));

            const response = await fetch('/save-track', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const trackId = await response.text();

                window.location.href = `/download/${trackId}`;

                saveButton.textContent = 'Save Recording';
                saveButton.disabled = false;
            } else {
                throw new Error('Failed to save recording');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error saving recording');
            saveButton.textContent = 'Save Recording';
            saveButton.disabled = false;
        }
    }
</script>
</body>
</html>
